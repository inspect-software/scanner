[project]
name = "inspect-scanner"
version = "0.8.0"
description = "CLI scanner that audits public GitHub repositories and produces JSON reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
inspect-scan = "scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]
